\"6\" width=\"4\" height=\"10\" rx=\"1\"/><rect x=\"16\" y=\"9\" width=\"4\" height=\"6\" rx=\"1\"/>", "sig": "<path d=\"M3 17l5-5 4 4 8-9\"/><path d=\"M15 7h5v5\"/>", "pos": "<rect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"2\"/><path d=\"M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\"/>", "hl": "<path d=\"M3 12h4l2-5 4 10 2-5h6\"/>", "bot": "<rect x=\"5\" y=\"8\" width=\"14\" height=\"11\" rx=\"3\"/><path d=\"M12 4v4M9 13h.01M15 13h.01\"/>", "more": "<circle cx=\"5\" cy=\"12\" r=\"1.5\"/><circle cx=\"12\" cy=\"12\" r=\"1.5\"/><circle cx=\"19\" cy=\"12\" r=\"1.5\"/>", "lock": "<rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\"/><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"/>", "shield": "<path d=\"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z\"/>", "loop": "<path d=\"M4 12a8 8 0 0 1 14-5l2 2M20 12a8 8 0 0 1-14 5l-2-2\"/><path d=\"M20 4v5h-5M4 20v-5h5\"/>", "bell": "<path d=\"M6 16V11a6 6 0 0 1 12 0v5l2 2H4z\"/><path d=\"M10 20a2 2 0 0 0 4 0\"/>", "fp": "<path d=\"M8 11a4 4 0 0 1 8 0v2a8 8 0 0 1-2 5M12 11v3a6 6 0 0 1-3 5M6 15c.6-1 1-2 1-4a5 5 0 0 1 10 0\"/>", "pc": "<rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"2\"/><path d=\"M8 20h8M12 16v4\"/>", "up": "<path d=\"M12 19V5M5 12l7-7 7 7\"/>", "flame": "<path d=\"M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z\"/>", "spark": "<path d=\"M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6\"/>", "back": "<path d=\"M15 5l-7 7 7 7\"/>", "pause": "<rect x=\"6\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"/><rect x=\"14\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"/>"};
const DOTS=c=>`<i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c};margin-right:2px"></i>`;
const ic=(n,s=18,c="currentColor")=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const $=(s)=>document.querySelector(s);
const esc=(v)=>String(v==null?"":v).replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("theme")||'"dark"')}catch(e){}
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const APPV=(()=>{try{return TradeOS.version()}catch(e){return 0}})();
let TOK=LS.get("tok",""), ROUTE="signals", CTX={}, HOME=null;
// 2026-11-23: статика может грузиться с GitHub Pages (быстро, без туннеля) —

const API_BASE=/github\.io$/.test(location.hostname)?"https://roman-resale-shanty.ngrok-free.dev":"";

async function api(path,body){
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),8000);   // 2026-11-22: таймаут 8 с
  let r;
  try{ r=await fetch(API_BASE+"/m/api/"+path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json","X-Token":TOK,"ngrok-skip-browser-warning":"true"},body:body?JSON.stringify(body):undefined,signal:ctl.signal});

  if(/^\s*</.test(t)) throw new Error("HTML");   // ngrok interstitial/страница ошибки вместо JSON

/* ---------- график ---------- */
function drawCandles(cv,C,lv,Hh){ const W=cv.clientWidth||cv.parentNode.clientWidth, dpr=devicePixelRatio||1; cv.width=W*dpr; cv.height=Hh*dpr; cv.style.height=Hh+"px";
  const x=cv.getContext("2d"); x.scale(dpr,dpr); lv=lv.filter(a=>a[0]);
  let lo=Math.min(...C.map(c=>c.low),...lv.map(a=>+a[0])), hi=Math.max(...C.map(c=>c.high),...lv.map(a=>+a[0])); const pad=(hi-lo)*.06; lo-=pad; hi+=pad;
  const Y=(v)=>8+(hi-v)/(hi-lo)*(Hh-16), cw=(W-54)/C.length;
  x.strokeStyle="#1f1c2b"; for(let i=0;i<5;i++){const yy=8+i*(Hh-16)/4;x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy);x.stroke();x.fillStyle="#5f5a75";x.font="10px monospace";x.fillText(fmt(hi-(hi-lo)*i/4),W-52,yy+11)}
  C.forEach((c,i)=>{const col=c.close>=c.open?"#21c98a":"#f0506e",cx=i*cw+cw/2;x.strokeStyle=col;x.beginPath();x.moveTo(cx,Y(c.high));x.lineTo(cx,Y(c.low));x.stroke();x.fillStyle=col;x.fillRect(cx-cw*.35,Y(Math.max(c.open,c.close)),cw*.7,Math.max(1,Math.abs(Y(c.open)-Y(c.close))))});
